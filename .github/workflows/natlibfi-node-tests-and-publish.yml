name: NatLibFi KB node tests

on: push

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build-node-versions:
    name: Node version matrix
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm audit --package-lock-only --production --audit-level=moderate
      - run: npm ci --ignore-scripts --min-release-age=7
      - run: npm test
      - run: npm run build --if-present

  license-scan:
    name: License compliance check
    runs-on: ubuntu-latest
    container: node:24

    steps:
      - uses: actions/checkout@v7
      - uses: mikaelvesavuori/license-compliance-action@v1
        with:
          allow_licenses: MIT;ISC;0BSD;BSD-2-Clause;BSD-3-Clause;Apache-2.0;BlueOak-1.0.0
          exclude_pattern: /^@natlibfi/;pause
          # pause is dependency of passport and it contains MIT license in Readme.md for v0.0.1
          # https://github.com/stream-utils/pause/tree/v0.0.1#license

  njsscan:
    name: Njsscan check
    runs-on: ubuntu-latest
    container: node:24

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: nodejsscan scan
        id: njsscan
        uses: ajinabraham/njsscan-action@master
        with:
          args: "."

  publish:
    runs-on: ubuntu-latest
    container: node:24
    needs: [build-node-versions, license-scan, njsscan]
    if: contains(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7
      # Setup .npmrc file to publish to npm
      - name: Prepare node for publish
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: Clean install
        run: npm ci --ignore-scripts --min-release-age=7
      # Publish stable release with --tag latest
      - name: Publish stable release
        if: ${{!contains(github.ref, '-alpha')}}
        run: npm publish --tag=latest
      # Publish pre-release with --tag next
      - name: Publish pre-release
        if: contains(github.ref, '-alpha')
        run: npm publish --tag=next
